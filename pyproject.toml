[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pdp-sim"
version = "1.1.0"
description = "Phase-detection probe simulator for turbulent bubbly flows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-only"
authors = [
  { name = "Matthias Bürgler" },
  { name = "Daniel Valero" },
  { name = "Benjamin Hohermuth" },
  { name = "David F. Vetsch" },
  { name = "Robert M. Boes" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "h5py>=3.11,<4",
  "joblib>=1.4,<2",
  "jsonschema>=4.23,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
]

[project.urls]
Homepage = "https://gitlab.ethz.ch/vaw/public/pdp-sim"
Repository = "https://gitlab.ethz.ch/vaw/public/pdp-sim.git"
Issues = "https://gitlab.ethz.ch/vaw/public/pdp-sim/-/issues"

[project.scripts]
pdp-sim = "pdp_sim.cli:main"
pdp-sim-generate = "pdp_sim.cli:generate"
pdp-sim-process = "pdp_sim.cli:process"
pdp-sim-evaluate = "pdp_sim.cli:evaluate"

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/pdp_sim",
  "configuration.py",
  "dataio",
  "schemadef",
  "tools",
  "stsg_ssg.py",
  "stsg_ssg_functions.py",
  "mssp.py",
  "evaluate.py",
  "postprocess.py",
  "README.md",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdp_sim"]

[tool.hatch.build.targets.wheel.force-include]
"configuration.py" = "configuration.py"
"dataio" = "dataio"
"schemadef" = "schemadef"
"tools" = "tools"
"stsg_ssg.py" = "stsg_ssg.py"
"stsg_ssg_functions.py" = "stsg_ssg_functions.py"
"mssp.py" = "mssp.py"
"evaluate.py" = "evaluate.py"
"postprocess.py" = "postprocess.py"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-markers --cov=pdp_sim --cov=configuration --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["pdp_sim", "configuration"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
include = [
  "configuration.py",
  "src/**/*.py",
  "tests/unit/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pdp_sim", "configuration.py"]
explicit_package_bases = true
mypy_path = "src"
