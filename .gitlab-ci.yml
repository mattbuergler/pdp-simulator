stages:
  - quality
  - test

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

default:
  image: python:${PYTHON_VERSION}-slim
  cache:
    key: "uv-${PYTHON_VERSION}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .uv-cache/
  before_script:
    - python -m pip install uv==0.12.17
    - uv sync --locked --all-groups

quality:
  stage: quality
  variables:
    PYTHON_VERSION: "3.11"
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy
    - uv build

tests:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  script:
    - uv run pytest

scientific-regression-sequential:
  stage: test
  variables:
    PYTHON_VERSION: "3.11"
  tags:
    - sequential
  script:
    - uv run python tests/runtests.py -n 1 -C -r tests/[0-9]*
  artifacts:
    when: always
    paths:
      - tests/**/run/run.output
    expire_in: 1 week

scientific-regression-parallel:
  stage: test
  variables:
    PYTHON_VERSION: "3.11"
  tags:
    - parallel
  script:
    - uv run python tests/runtests.py -n 2 -C -r tests/[0-9]*
  artifacts:
    when: always
    paths:
      - tests/**/run/run.output
    expire_in: 1 week
